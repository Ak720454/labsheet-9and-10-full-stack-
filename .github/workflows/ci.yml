name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# This repository keeps the Node project in a sub-folder.
defaults:
  run:
    working-directory: problem1-task-api

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: problem1-task-api/package-lock.json
      - run: npm ci
      - run: npm run lint

  test:
    needs: lint            # lint runs first, tests only start if lint passed
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: problem1-task-api/package-lock.json
      - run: npm ci
      - run: npm test
        env:
          JWT_SECRET: ci-test-secret

  deploy:
    needs: test            # runs only if EVERY test matrix job passed
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy
        run: echo "Deploying commit ${{ github.sha }} (replace with your real deploy step)"
